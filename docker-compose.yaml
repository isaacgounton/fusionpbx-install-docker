services:
  app:
    build: .
    restart: always
    ports:
      # Web interface - map to different ports to avoid Coolify conflicts
      - "8080:80"
      - "8443:443"
      # SIP signaling ports
      - "5060:5060"
      - "5060:5060/udp"
      - "5061:5061"
      # RTP port range for VoIP (conservative 100 ports for testing)
      - "16384-16484:16384-16484/udp"
    environment:
      - POSTGRES_DB=fusionpbx
      - POSTGRES_USER=fusionpbx
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fusionpbx_password}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - fusionpbx_config:/etc/fusionpbx
    depends_on:
      - db
    entrypoint: ["/usr/sbin/init"]

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=fusionpbx
      - POSTGRES_USER=fusionpbx
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fusionpbx_password}
    volumes:
      - fusionpbx_db:/var/lib/postgresql/data

volumes:
  fusionpbx_config:
  fusionpbx_db:
