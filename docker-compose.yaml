services:
  app:
    image: michaelfangtw/fusionpbx-docker:5.4
    restart: always
    ports:
      # Web interface - map to different ports to avoid Coolify conflicts
      - "8080:80"
      - "8443:443"
      # SIP signaling ports
      - "5060:5060"
      - "5060:5060/udp"
      - "5061:5061"
      # RTP port range for VoIP (conservative 100 ports for testing)
      - "16384-16484:16384-16484/udp"
    environment:
      - POSTGRES_DB=fusionpbx
      - POSTGRES_USER=fusionpbx
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fusionpbx_password}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - fusionpbx_config:/etc/fusionpbx
    command:
      [
        "/bin/bash",
        "-c",
        "service postgresql start && sleep 10 && service freeswitch start && sleep 5 && service nginx start && service php8.3-fpm start && sleep 5 && tail -f /var/log/nginx/error.log /var/log/freeswitch/freeswitch.log",
      ]

volumes:
  fusionpbx_config:
